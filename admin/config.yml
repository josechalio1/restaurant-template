# Decap CMS config — intentionally scoped to ONLY the menu.
# The client should never see design, pages, or settings here —
# just their menu items. See PROJECT_BRIEF.md for why.

backend:
  name: git-gateway
  repo: josechalio1/restaurant-template
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/32d6e105-92c3-4d4e-b306-afa1549db509/pkce
  auth_token_endpoint: /sites/32d6e105-92c3-4d4e-b306-afa1549db509/token
  gateway_url: https://gateway.decapbridge.com

# See who did what
commit_messages:
  create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Only takes effect when the admin panel is opened on localhost — lets you
# test the editor against this local git repo (via `npx decap-server`)
# without any real auth provider. Ignored in production.
local_backend: true

media_folder: "media"
public_folder: "/media"

collections:
  - name: "menu"
    label: "Menu"
    label_singular: "Menu Item"
    folder: "content/menu"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Dish name", name: "title", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Smoked Meats", "Sandwiches", "Sides", "Drinks & Dessert"]
      - { label: "Price", name: "price", widget: "string", hint: "Numbers only, e.g. 22" }
      - { label: "Unit (optional)", name: "unit", widget: "string", required: false, hint: "e.g. 'per lb' or 'half rack' — leave blank if none" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Sort order within category", name: "order", widget: "number", default: 1 }
